<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
    <nav id="nav-root" class="container"></nav>

    <div class="container auth-container">
        <div class="card auth-card">
            <h2 class="auth-title">Login</h2>

            <div id="login-error" class="error"></div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input id="login-email" class="input" placeholder="email@example.com" />
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input id="login-password" type="password" class="input" placeholder="••••••••" />
            </div>

            <div class="controls auth-controls">
                <button id="login-btn" class="btn btn-primary full-width">Login</button>
                
                <div class="auth-footer">
                    Don't have an account? <a href="register.html" class="auth-link">Register</a>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
