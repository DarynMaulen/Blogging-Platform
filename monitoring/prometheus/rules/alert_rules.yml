groups:
  - name: app.alerts
    interval: 30s
    rules:
      - alert: BackendHigh5xxRateWarning
        expr: |
          (
            sum(rate(http_requests_total{job="backend",status=~"5.."}[1m])) 
            / 
            clamp_min(sum(rate(http_requests_total{job="backend"}[1m])), 1)
          ) * 100 > 0.5
        for: 1m
        labels:
          severity: warning
          service: backend
        annotations:
          summary: "Backend 5xx error rate is above 0.5%"
          description: "High error rate detected on backend: {{ $value | printf \"%.2f\" }}%"

      - alert: BackendDownCritical
        expr: sum(up{job="backend"}) == 0
        for: 30s 
        labels:
          severity: critical
          service: backend
        annotations:
          summary: "Backend is DOWN"
          description: "All backend replicas are unreachable."