version: "3.8"

services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - blogging-net
    deploy:
      replicas: 1

  backend:
    image: localhost:5000/blog-backend:1.0
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/blogging
      JWT_SECRET: supersecret123
      JWT_EXPIRES_IN: 604800
    ports:
      - "4000:4000"
    networks:
      - blogging-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  frontend:
    image: localhost:5000/blog-frontend:1.0
    ports:
      - "8081:80"
    networks:
      - blogging-net
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
    networks:
      - blogging-net
    deploy:
      replicas: 1

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    networks:
      - blogging-net
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    deploy:
      replicas: 1

  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    networks:
      - blogging-net
    deploy:
      replicas: 1

volumes:
  mongo_data:
  grafana_data:

networks:
  blogging-net:
    driver: overlay